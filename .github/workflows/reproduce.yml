
name: Reproduce Paper I figures and checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  reproducibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install figure dependencies
        run: python -m pip install -r requirements-figures.txt
      - name: Run all figure generators and exact arithmetic checks
        run: python reproduce.py --all
      - name: Upload reproduced figures and data
        uses: actions/upload-artifact@v4
        with:
          name: paper-i-figures-and-data
          path: |
            figures/*.pdf
            figures/*.png
            data/figure_*.csv
